[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_audio"
version = "0.1.0"
description = "4-microphone synchronized spatial audio system for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "PyYAML>=6.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
spatial_audio = "spatial_audio.__main__:main"
